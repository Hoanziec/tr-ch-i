<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đường Cao Trên Lưới Ô Vuông - Trò Chơi Toán Học</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-main: 'Be Vietnam Pro', 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font-main);
      background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 48%, #ecfeff 100%);
      color: #0f172a;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .grid-canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 10 / 7;
      max-height: 440px;
      background: #ffffff;
      border-radius: 1rem;
      border: 2px solid #cbd5e1;
      box-shadow: inset 0 2px 6px rgba(15, 23, 42, 0.04);
      touch-action: manipulation;
      user-select: none;
    }

    .grid-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hit-point {
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .hit-point:hover {
      opacity: 0.92;
    }

    .pop-in {
      animation: popIn 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body class="antialiased selection:bg-sky-200 selection:text-sky-950">
  <div id="app" class="max-w-5xl mx-auto px-3 sm:px-6 py-4 sm:py-6">
    <!-- Header ứng dụng -->
    <header class="bg-white/95 backdrop-blur rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-5 mb-4 sm:mb-6">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div class="flex items-start sm:items-center gap-3">
          <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-br from-sky-500 to-indigo-600 text-white flex items-center justify-center font-extrabold text-lg sm:text-xl shadow-md shrink-0">
            △H
          </div>
          <div>
            <div class="flex flex-wrap items-center gap-2">
              <h1 class="text-lg sm:text-2xl font-extrabold text-slate-900 tracking-tight">
                Đường Cao Trên Lưới Ô Vuông
              </h1>
              <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-sky-100 text-sky-800">
                Toán Tiểu Học
              </span>
            </div>
            <p class="text-xs sm:text-sm text-slate-600 mt-0.5">
              Xác định đỉnh đối diện, vẽ đường cao vuông góc và xử lý đáy khi có góc tù
            </p>
          </div>
        </div>

        <div class="flex items-center justify-between sm:justify-end gap-2 sm:gap-3 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100">
          <div class="bg-amber-50 border border-amber-200 rounded-xl px-3 py-1.5 text-center">
            <div class="text-[11px] font-semibold uppercase tracking-wider text-amber-700">Điểm số</div>
            <div id="score-display" class="text-base sm:text-lg font-extrabold text-amber-900">0</div>
          </div>
          <div class="bg-indigo-50 border border-indigo-200 rounded-xl px-3 py-1.5 text-center">

            <div id="progress-text" class="text-base sm:text-lg font-extrabold text-indigo-900">1 / 7</div>
          </div>
          <button
            id="btn-restart-all"
            type="button"
            class="p-2.5 sm:px-3.5 sm:py-2 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-semibold text-xs sm:text-sm transition flex items-center gap-1.5"
            title="Chơi lại từ đầu"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <span class="hidden sm:inline">Chơi lại</span>
          </button>
        </div>
      </div>

      <!-- Thanh tiến độ -->
      <div class="mt-4">
        <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
          <div id="progress-bar" class="h-full bg-gradient-to-r from-sky-500 via-indigo-500 to-emerald-500 rounded-full transition-all duration-300" style="width: 14%"></div>
        </div>
        <div id="round-pills" class="flex flex-wrap gap-1.5 sm:gap-2 mt-3"></div>
      </div>
    </header>

    <!-- Nội dung chính -->
    <main id="game-container" class="pop-in"></main>

    <!-- Hộp thoại thông báo nội bộ (thay thế alert/confirm) -->
    <div id="toast-banner" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden max-w-[92vw] sm:max-w-md w-full">
      <div id="toast-inner" class="rounded-2xl px-4 py-3 shadow-xl border text-xs sm:text-sm font-semibold text-center bg-slate-900 text-white border-slate-700"></div>
    </div>

    <!-- Ghi nhớ quy tắc chốt ở chân trang -->
    <footer class="mt-6 bg-emerald-50/90 border border-emerald-200 rounded-2xl p-3.5 sm:p-4 text-center shadow-xs">
      <p class="text-xs sm:text-sm font-bold text-emerald-950">
        Quy tắc ghi nhớ: "Đường cao được kẻ qua đỉnh đối diện và vuông góc với đáy đã cho."
      </p>
    </footer>
  </div>

  <script>
    /**
     * -------------------------------------------------------------------------
     * DỮ LIỆU TRÒ CHƠI: "ĐƯỜNG CAO TRÊN LƯỚI Ô VUÔNG"
     * Lưới tọa độ quy chuẩn: cols = 10 (x: 0..10), rows = 7 (y: 0..7)
     * -------------------------------------------------------------------------
     */
    const GRID_COLS = 10;
    const GRID_ROWS = 7;

    const LEVELS = [
      // ==================== VÒNG 1: BẮT ĐỈNH - BẮT ĐÁY ====================
      {
        id: 1,
        round: 1,
        roundTitle: 'Vòng 1: Bắt đỉnh - Bắt đáy',
        badgeClass: 'bg-sky-100 text-sky-800 border-sky-200',
        prompt: 'Với tam giác DEG có đáy là cạnh GE, đỉnh nào đối diện với đáy GE?',
        hint: 'Hãy tìm đỉnh không nằm trên đoạn thẳng GE của tam giác DEG.',
        vertices: {
          D: { x: 2, y: 1.5 },
          G: { x: 2, y: 5.5 },
          E: { x: 6, y: 4 }
        },
        triangleOrder: ['D', 'G', 'E'],
        baseSegment: ['G', 'E'],
        choices: ['D', 'E', 'G'],
        correctVertex: 'D',
        explanation: 'Trong tam giác DEG, đáy là GE nên đỉnh đối diện với đáy GE là đỉnh D.'
      },
      {
        id: 2,
        round: 1,
        roundTitle: 'Vòng 1: Bắt đỉnh - Bắt đáy',
        badgeClass: 'bg-sky-100 text-sky-800 border-sky-200',
        prompt: 'Vẫn là tam giác DEG: nếu chọn DG làm đáy thì đỉnh nào đối diện với đáy DG?',
        hint: 'Nhìn vào cạnh DG thẳng đứng bên trái, tìm đỉnh còn lại của tam giác DEG.',
        vertices: {
          D: { x: 2, y: 1.5 },
          G: { x: 2, y: 5.5 },
          E: { x: 6, y: 4 }
        },
        triangleOrder: ['D', 'G', 'E'],
        baseSegment: ['D', 'G'],
        choices: ['D', 'E', 'G'],
        correctVertex: 'E',
        explanation: 'Khi chọn DG làm đáy của tam giác DEG, đỉnh còn lại đối diện với DG là đỉnh E.'
      },
      {
        id: 3,
        round: 1,
        roundTitle: 'Vòng 1: Bắt đỉnh - Bắt đáy',
        badgeClass: 'bg-sky-100 text-sky-800 border-sky-200',
        prompt: 'Với tam giác IKL có đáy là cạnh KI, đỉnh nào đối diện với đáy KI?',
        hint: 'Xác định 3 đỉnh I, K, L của tam giác rồi tìm đỉnh không thuộc cạnh KI.',
        vertices: {
          I: { x: 8, y: 5.5 },
          K: { x: 5, y: 3 },
          L: { x: 6.5, y: 1.5 }
        },
        triangleOrder: ['I', 'K', 'L'],
        baseSegment: ['K', 'I'],
        choices: ['I', 'K', 'L'],
        correctVertex: 'L',
        explanation: 'Trong tam giác IKL, cạnh KI nối đỉnh K và đỉnh I nên đỉnh đối diện với đáy KI là đỉnh L.'
      },

      // ==================== VÒNG 2: KIẾN TRÚC SƯ VẼ ĐƯỜNG CAO ====================
      {
        id: 4,
        round: 2,
        roundTitle: 'Vòng 2: Kiến trúc sư vẽ đường cao',
        badgeClass: 'bg-indigo-100 text-indigo-800 border-indigo-200',
        prompt: 'Vẽ đường cao ứng với đáy GE của tam giác DEG. Hãy chạm chọn ĐỈNH đối diện rồi chạm chọn ĐIỂM chân đường cao trên đáy GE (hoặc dùng gợi ý điểm lưới).',
        hint: 'Đáy là GE thì đường cao hạ từ đỉnh D, vuông góc với GE tại điểm H(4.4, 4.6). Bạn có thể chạm trực tiếp vào các điểm gợi ý trên lưới!',
        vertices: {
          D: { x: 2, y: 1.5 },
          G: { x: 2, y: 5.5 },
          E: { x: 6, y: 4 }
        },
        triangleOrder: ['D', 'G', 'E'],
        baseSegment: ['G', 'E'],
        extendBaseTo: null,
        requiredFrom: 'D',
        // Hình chiếu vuông góc của D(2, 1.5) lên đoạn GE từ G(2, 5.5) đến E(6, 4):
        // Vector GE = (4, -1.5), |GE|^2 = 16 + 2.25 = 18.25
        // GD = (0, -4), dot = 6, t = 6 / 18.25 ≈ 0.3288 => H = (2 + 1.315, 5.5 - 0.493) = (3.32, 5.01)
        targetFoot: { x: 3.315, y: 5.007, label: 'H' },
        candidateFeet: [
          { id: 'f1', label: 'H (chuẩn)', x: 3.315, y: 5.007, isCorrect: true },
          { id: 'f2', label: 'M (giữa GE)', x: 4, y: 4.75, isCorrect: false },
          { id: 'f3', label: 'N (lệch góc)', x: 3.8, y: 5.5, isCorrect: false }
        ],
        explanation: 'Đáy là GE nên đường cao hạ từ đỉnh D, vuông góc với GE tại điểm H. Đoạn DH chính là đường cao ứng với đáy GE của tam giác DEG.'
      },
      {
        id: 5,
        round: 2,
        roundTitle: 'Vòng 2: Kiến trúc sư vẽ đường cao',
        badgeClass: 'bg-indigo-100 text-indigo-800 border-indigo-200',
        prompt: 'Thử thách góc tù ở đáy! Hãy vẽ đường cao ứng với đáy IK của tam giác IKL bằng cách chọn ĐỈNH đối diện và ĐIỂM vuông góc trên phần kéo dài của đáy IK.',
        hint: 'Đáy là IK, đỉnh đối diện là L(6.5, 1.5). Vì góc tại đỉnh K là góc tù, đường vuông góc từ L sẽ rơi ra ngoài đoạn IK (trên phần kéo dài của IK về phía bên trái).',
        vertices: {
          I: { x: 8, y: 5.5 },
          K: { x: 5, y: 3 },
          L: { x: 6.5, y: 1.5 }
        },
        triangleOrder: ['I', 'K', 'L'],
        baseSegment: ['K', 'I'],
        // Đường thẳng qua K(5, 3) và I(8, 5.5): dx = 3, dy = 2.5.
        // Kéo dài về phía trái: điểm P(2.6, 1)
        extendBaseTo: { x: 2.6, y: 1.0 },
        requiredFrom: 'L',
        // Hình chiếu của L(6.5, 1.5) lên đường thẳng qua K(5,3) và I(8,5.5):
        // v = (3, 2.5), |v|^2 = 15.25; KL = (1.5, -1.5), dot = 4.5 - 3.75 = 0.75
        // t = 0.75 / 15.25 ≈ 0.04918 => Q = (5 + 0.1475, 3 + 0.123) = (5.15, 3.12)? Khoan kiểm tra kỹ!
        // Kiểm tra lại: K=(5,3), I=(8,5.5), L=(6.5,1.5).
        // Vector KI = (3, 2.5). Vector KL = (1.5, -1.5).
        // Tích vô hướng KL · KI = 1.5*3 + (-1.5)*2.5 = 4.5 - 3.75 = +0.75 > 0.
        // Như vậy Q nằm giữa K và I (x ≈ 5.15, y ≈ 3.12). Để có trường hợp đường cao rơi ra ngoài đáy IK, ta đặt L ở (4.2, 4.2) hoặc chọn đáy KL với đỉnh I!
        // Hãy làm cho chuẩn xác: với I(8, 5.5), K(5, 3), L(4.2, 4.2):
        // Đáy là KL: đường thẳng KL qua K(5,3) và L(4.2, 4.2), vector KL = (-0.8, 1.2).
        // Từ đỉnh I(8, 5.5), vector KI = (3, 2.5). Tích vô hướng KI · KL = 3*(-0.8) + 2.5*1.2 = -2.4 + 3.0 = +0.6 > 0,
        // nhưng chiếu vuông góc từ I(8, 5.5) lên đường thẳng qua K(5,3) và L(4.2,4.2):
        // |KL|^2 = 0.64 + 1.44 = 2.08. t = 0.6 / 2.08 ≈ 0.2885.
        // Q = (5 + 0.2885*(-0.8), 3 + 0.2885*1.2) = (4.77, 3.35) -> nằm giữa K(5,3) và L(4.2,4.2).
        // Muốn rơi ra ngoài phần kéo dài của đáy: chọn đáy là KL, đỉnh là I(8, 5.5), với K(5.5, 4.5) và L(6.8, 3.2):
        // Vector KL = (1.3, -1.3). Vector KI = (2.5, 1.0).
        // Tích vô hướng KI · KL = 2.5*1.3 + 1.0*(-1.3) = 3.25 - 1.3 = +1.95.
        // |KL|^2 = 1.69 + 1.69 = 3.38. t = 1.95 / 3.38 ≈ 0.5769 -> Q = (5.5 + 0.75, 4.5 - 0.75) = (6.25, 3.75).
        // Còn nếu đáy là đoạn ngắn KL với K(6, 4.5), L(7.2, 3.5), đỉnh I(4.5, 2.2):
        // Vector KL = (1.2, -1.0), |KL|^2 = 2.44. Vector KI = (-1.5, -2.3).
        // KI · KL = -1.8 + 2.3 = +0.5. t = 0.5 / 2.44 ≈ 0.205 -> Q = (6.25, 4.29).
        // Muốn t < 0 (rơi ra ngoài phía K): cần KI · KL < 0!
        // Ví dụ: đáy là đoạn ngắn từ A(5.5, 4.5) đến B(7.2, 4.5) (đáy nằm ngang cho học sinh dễ quan sát góc tù!), đỉnh đối diện là C(4.2, 2.0).
        // Vì x_C = 4.2 < x_A = 5.5, đường vuông góc từ C(4.2, 2.0) xuống đường thẳng chứa đáy AB (y = 4.5) sẽ là đoạn thẳng đứng từ (4.2, 2.0) xuống H(4.2, 4.5)!
        // Điểm H(4.2, 4.5) nằm trên PHẦN KÉO DÀI của đáy AB về phía trái! Rất trực quan, chuẩn xác trên lưới ô vuông!
        overrideVertices: {
          A: { x: 5.5, y: 4.5 },
          B: { x: 8.2, y: 4.5 },
          C: { x: 4.2, y: 2.0 }
        },
        overrideLabels: { A: 'K', B: 'I', C: 'L' },
        baseSegment: ['A', 'B'],
        extendBaseTo: { x: 3.2, y: 4.5 },
        requiredFrom: 'C',
        targetFoot: { x: 4.2, y: 4.5, label: 'H' },
        candidateFeet: [
          { id: 'f1', label: 'H (trên phần kéo dài đáy)', x: 4.2, y: 4.5, isCorrect: true },
          { id: 'f2', label: 'M (trên đoạn đáy)', x: 6.5, y: 4.5, isCorrect: false },
          { id: 'f3', label: 'N (xiên vào đỉnh)', x: 5.5, y: 4.5, isCorrect: false }
        ],
        explanation: 'Với đáy nằm ở góc tù, ta kéo dài cạnh đáy về phía bên trái rồi hạ đường vuông góc từ đỉnh đối diện xuống phần kéo dài của đáy.'
      },

      // ==================== VÒNG 3: GIẢI CỨU ĐƯỜNG CAO BỊ LẠC ====================
      {
        id: 6,
        round: 3,
        roundTitle: 'Vòng 3: Giải cứu đường cao bị lạc',
        badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-200',
        prompt: 'Phát hiện "đường cao bị lạc"! Đường nét đứt màu đỏ đang vẽ cho tam giác DEG với đáy GE nhưng bị vẽ sai. Hãy chỉ ra lỗi sai của đường nét đứt đỏ.',
        hint: 'Đáy là GE thì đường cao phải xuất phát từ đỉnh nào và vuông góc với GE.',
        vertices: {
          D: { x: 2, y: 1.5 },
          G: { x: 2, y: 5.5 },
          E: { x: 6, y: 4 }
        },
        triangleOrder: ['D', 'G', 'E'],
        baseSegment: ['G', 'E'],
        wrongLine: {
          from: { x: 2, y: 5.5 }, // xuất phát từ G (nằm trên đáy)
          to: { x: 4.5, y: 2.5 }    // không qua đỉnh D
        },
        errorOptions: [
          { id: 'wrong_vertex', label: 'Không kẻ qua đỉnh đối diện D' },
          { id: 'not_perpendicular', label: 'Đường vẽ không vuông góc với đáy GE' },
          { id: 'missing_extension', label: 'Quên kéo dài cạnh đáy' }
        ],
        correctErrorId: 'wrong_vertex',
        fixedLine: {
          from: { x: 2, y: 1.5 },
          to: { x: 3.315, y: 5.007 },
          showRightAngleAt: { x: 3.315, y: 5.007 }
        },
        explanation: 'Đường màu đỏ không xuất phát từ đỉnh đối diện D. Đúng ra phải kẻ từ đỉnh D và vuông góc với đáy GE.'
      },
      {
        id: 7,
        round: 3,
        roundTitle: 'Vòng 3: Giải cứu đường cao bị lạc',
        badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-200',
        prompt: 'Ca giải cứu cuối cùng! Hình bên dưới có đáy nằm ngang (đánh dấu đậm) và đỉnh đối diện ở phía trên-trái, nhưng đường nét đứt đỏ lại kẻ xiên vào trong hình. Lỗi sai ở đây là gì?',
        hint: 'Quan sát góc tạo bởi đường nét đứt đỏ với đường đáy: có tạo thành góc vuông 90° không, hay cần kéo dài đáy và hạ vuông góc?',
        overrideVertices: {
          A: { x: 5.5, y: 4.8 },
          B: { x: 8.2, y: 4.8 },
          C: { x: 4.0, y: 1.8 }
        },
        overrideLabels: { A: 'K', B: 'I', C: 'L' },
        baseSegment: ['A', 'B'],
        extendBaseTo: { x: 3.0, y: 4.8 },
        wrongLine: {
          from: { x: 4.0, y: 1.8 },
          to: { x: 6.5, y: 4.8 }
        },
        errorOptions: [
          { id: 'wrong_vertex', label: 'Hạ từ nhầm đỉnh' },
          { id: 'not_perpendicular', label: 'Kẻ xiên, không vuông góc với đường thẳng chứa đáy' },
          { id: 'wrong_triangle', label: 'Nhầm tên tam giác' }
        ],
        correctErrorId: 'not_perpendicular',
        fixedLine: {
          from: { x: 4.0, y: 1.8 },
          to: { x: 4.0, y: 4.8 },
          showRightAngleAt: { x: 4.0, y: 4.8 }
        },
        explanation: 'Đường nét đứt đỏ kẻ xiên vào điểm giữa đáy nên không vuông góc. Đường cao đúng phải hạ thẳng đứng từ đỉnh trên xuống phần kéo dài của đáy và vuông góc (90°).'
      }
    ];

    /**
     * -------------------------------------------------------------------------
     * TRẠNG THÁI ỨNG DỤNG
     * -------------------------------------------------------------------------
     */
    const state = {
      currentIndex: 0,
      score: 0,
      answeredMap: {}, // levelId -> { correct: boolean, pointsEarned: number }
      selectedChoice: null,
      // Trạng thái riêng cho Vòng 2
      drawSelectedVertex: null,
      drawSelectedFootId: null,
      // Trạng thái riêng cho Vòng 3
      selectedErrorId: null,
      showFixedLine: false,
      // Trạng thái màn tổng kết
      finished: false
    };

    /**
     * Tiện ích hiển thị thông báo ngắn (không dùng alert/confirm)
     */
    let toastTimer = null;
    function showToast(message, type = 'info') {
      const banner = document.getElementById('toast-banner');
      const inner = document.getElementById('toast-inner');
      inner.className = 'rounded-2xl px-4 py-3 shadow-xl border text-xs sm:text-sm font-semibold text-center transition-all ' + (
        type === 'error'
          ? 'bg-rose-900 text-white border-rose-700'
          : type === 'success'
            ? 'bg-emerald-900 text-white border-emerald-700'
            : 'bg-slate-900 text-white border-slate-700'
      );
      inner.textContent = message;
      banner.classList.remove('hidden');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        banner.classList.add('hidden');
      }, 2600);
    }

    /**
     * Lấy cấu hình hình học chuẩn hóa cho từng câu hỏi
     */
    function getLevelGeometry(level) {
      if (level.overrideVertices) {
        const v = level.overrideVertices;
        const lbl = level.overrideLabels || { A: 'A', B: 'B', C: 'C' };
        return {
          points: {
            [lbl.A]: v.A,
            [lbl.B]: v.B,
            [lbl.C]: v.C
          },
          order: [lbl.A, lbl.B, lbl.C],
          base: [lbl[level.baseSegment[0]], lbl[level.baseSegment[1]]],
          extendTo: level.extendBaseTo || null
        };
      }
      return {
        points: level.vertices,
        order: level.triangleOrder,
        base: level.baseSegment,
        extendTo: level.extendBaseTo || null
      };
    }

    /**
     * Chuyển tọa độ lưới (0..10, 0..7) sang tọa độ SVG (viewBox 0 0 1000 700)
     */
    function toSvgCoords(pt) {
      const padX = 80;
      const padY = 60;
      const usableW = 1000 - padX * 2;
      const usableH = 700 - padY * 2;
      const x = padX + (pt.x / GRID_COLS) * usableW;
      const y = padY + (pt.y / GRID_ROWS) * usableH;
      return { x, y };
    }

    /**
     * Vẽ ký hiệu góc vuông nhỏ tại chân đường cao
     */
    function buildRightAnglePath(footGrid, fromGrid, basePt1Grid, basePt2Grid) {
      const foot = toSvgCoords(footGrid);
      const vFrom = toSvgCoords(fromGrid);
      const vBase = toSvgCoords(basePt2Grid);

      const d1x = vFrom.x - foot.x;
      const d1y = vFrom.y - foot.y;
      const len1 = Math.hypot(d1x, d1y) || 1;
      const u1x = (d1x / len1) * 18;
      const u1y = (d1y / len1) * 18;

      const d2x = vBase.x - foot.x;
      const d2y = vBase.y - foot.y;
      const len2 = Math.hypot(d2x, d2y) || 1;
      const u2x = (d2x / len2) * 18;
      const u2y = (d2y / len2) * 18;

      const p1x = foot.x + u1x;
      const p1y = foot.y + u1y;
      const p2x = foot.x + u1x + u2x;
      const p2y = foot.y + u1y + u2y;
      const p3x = foot.x + u2x;
      const p3y = foot.y + u2y;

      return `M ${p1x.toFixed(1)} ${p1y.toFixed(1)} L ${p2x.toFixed(1)} ${p2y.toFixed(1)} L ${p3x.toFixed(1)} ${p3y.toFixed(1)}`;
    }

    /**
     * Tạo chuỗi SVG hoàn chỉnh hiển thị lưới ô vuông + tam giác + tương tác
     */
    function renderGridSvg(level, options = {}) {
      const geom = getLevelGeometry(level);
      const { points, order, base, extendTo } = geom;

      let gridLines = '';
      const padX = 80;
      const padY = 60;
      const usableW = 1000 - padX * 2;
      const usableH = 700 - padY * 2;

      for (let c = 0; c <= GRID_COLS; c++) {
        const x = padX + (c / GRID_COLS) * usableW;
        gridLines += `<line x1="${x}" y1="${padY}" x2="${x}" y2="${700 - padY}" stroke="#e2e8f0" stroke-width="1.5" />`;
      }
      for (let r = 0; r <= GRID_ROWS; r++) {
        const y = padY + (r / GRID_ROWS) * usableH;
        gridLines += `<line x1="${padX}" y1="${y}" x2="${1000 - padX}" y2="${y}" stroke="#e2e8f0" stroke-width="1.5" />`;
      }

      // Phần kéo dài đáy (nét chấm xanh ngọc)
      let extensionSvg = '';
      if (extendTo) {
        const bStart = toSvgCoords(points[base[0]]);
        const extEnd = toSvgCoords(extendTo);
        extensionSvg = `
          <line x1="${extEnd.x}" y1="${extEnd.y}" x2="${bStart.x}" y2="${bStart.y}"
                stroke="#0d9488" stroke-width="3" stroke-dasharray="7 6" opacity="0.85" />
          <text x="${extEnd.x}" y="${extEnd.y - 12}" text-anchor="middle"
                fill="#0f766e" font-size="18" font-weight="700">Phần kéo dài đáy</text>
        `;
      }

      // Hình tam giác chính
      const polyPts = order.map((k) => {
        const p = toSvgCoords(points[k]);
        return `${p.x},${p.y}`;
      }).join(' ');

      const b1 = toSvgCoords(points[base[0]]);
      const b2 = toSvgCoords(points[base[1]]);

      // Đường cao đang vẽ (Vòng 2) hoặc đường sai/đúng (Vòng 3)
      let extraLines = '';

      if (level.round === 2) {
        const activeVertex = state.drawSelectedVertex ? points[state.drawSelectedVertex] : null;
        const activeFootObj = level.candidateFeet.find((f) => f.id === state.drawSelectedFootId) || null;

        if (activeVertex && activeFootObj) {
          const pFrom = toSvgCoords(activeVertex);
          const pTo = toSvgCoords(activeFootObj);
          const isAnswered = Boolean(state.answeredMap[level.id]);
          const strokeCol = isAnswered
            ? (state.answeredMap[level.id].correct ? '#059669' : '#e11d48')
            : '#2563eb';

          extraLines += `
            <line x1="${pFrom.x}" y1="${pFrom.y}" x2="${pTo.x}" y2="${pTo.y}"
                  stroke="${strokeCol}" stroke-width="4" stroke-dasharray="${activeFootObj.isCorrect ? '' : '8 6'}" />
          `;
          if (activeFootObj.isCorrect) {
            const sqPath = buildRightAnglePath(activeFootObj, activeVertex, points[base[0]], points[base[1]]);
            extraLines += `<path d="${sqPath}" fill="none" stroke="${strokeCol}" stroke-width="2.5" />`;
          }
        }
      }

      if (level.round === 3) {
        if (!state.showFixedLine && level.wrongLine) {
          const w1 = toSvgCoords(level.wrongLine.from);
          const w2 = toSvgCoords(level.wrongLine.to);
          extraLines += `
            <line x1="${w1.x}" y1="${w1.y}" x2="${w2.x}" y2="${w2.y}"
                  stroke="#e11d48" stroke-width="4" stroke-dasharray="9 6" />
            <circle cx="${w2.x}" cy="${w2.y}" r="7" fill="#e11d48" />
            <text x="${w2.x + 14}" y="${w2.y - 8}" fill="#be123c" font-size="19" font-weight="800">Đường sai?</text>
          `;
        } else if (state.showFixedLine && level.fixedLine) {
          const f1 = toSvgCoords(level.fixedLine.from);
          const f2 = toSvgCoords(level.fixedLine.to);
          const sqPath = buildRightAnglePath(
            level.fixedLine.showRightAngleAt,
            level.fixedLine.from,
            points[base[0]],
            points[base[1]]
          );
          extraLines += `
            <line x1="${f1.x}" y1="${f1.y}" x2="${f2.x}" y2="${f2.y}"
                  stroke="#059669" stroke-width="4.5" />
            <path d="${sqPath}" fill="none" stroke="#059669" stroke-width="2.8" />
            <circle cx="${f2.x}" cy="${f2.y}" r="6" fill="#059669" />
          `;
        }
      }

      // Các điểm ứng viên chân đường cao ở Vòng 2
      let candidateNodes = '';
      if (level.round === 2 && options.interactiveFeet) {
        level.candidateFeet.forEach((foot) => {
          const pos = toSvgCoords(foot);
          const isSelected = state.drawSelectedFootId === foot.id;
          candidateNodes += `
            <g class="hit-point" data-foot-id="${foot.id}" role="button" tabindex="0" aria-label="Chọn điểm ${foot.label}">
              <circle cx="${pos.x}" cy="${pos.y}" r="${isSelected ? 17 : 14}"
                      fill="${isSelected ? '#2563eb' : '#ffffff'}"
                      stroke="${isSelected ? '#1d4ed8' : '#0284c7'}"
                      stroke-width="3.5" />
              <circle cx="${pos.x}" cy="${pos.y}" r="5" fill="${isSelected ? '#ffffff' : '#0284c7'}" />
              <text x="${pos.x}" y="${pos.y + 30}" text-anchor="middle"
                    font-size="16" font-weight="700" fill="#0f172a">${foot.label.split(' ')[0]}</text>
            </g>
          `;
        });
      }

      // Các đỉnh của tam giác
      const vertexNodes = order.map((key) => {
        const p = toSvgCoords(points[key]);
        const isSelected = (level.round === 1 && state.selectedChoice === key) ||
          (level.round === 2 && state.drawSelectedVertex === key);
        const isClickable = level.round === 2 && options.interactiveVertices;

        // Đặt nhãn đỉnh hơi lệch ra ngoài để không đè lên nét vẽ
        const centerX = order.reduce((acc, k) => acc + toSvgCoords(points[k]).x, 0) / order.length;
        const centerY = order.reduce((acc, k) => acc + toSvgCoords(points[k]).y, 0) / order.length;
        const dx = p.x >= centerX ? 22 : -22;
        const dy = p.y >= centerY ? 24 : -16;

        return `
          <g class="${isClickable ? 'hit-point' : ''}" ${isClickable ? `data-vertex="${key}" role="button" tabindex="0" aria-label="Chọn đỉnh ${key}"` : ''}>
            ${isClickable ? `<circle cx="${p.x}" cy="${p.y}" r="22" fill="rgba(59, 130, 246, 0.14)" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3" />` : ''}
            <circle cx="${p.x}" cy="${p.y}" r="${isSelected ? 10 : 7.5}"
                    fill="${isSelected ? '#1d4ed8' : '#0f172a'}"
                    stroke="#ffffff" stroke-width="2.5" />
            <text x="${p.x + dx}" y="${p.y + dy}" text-anchor="middle"
                  font-size="23" font-weight="800" fill="#0f172a">${key}</text>
          </g>
        `;
      }).join('');

      return `
        <div class="grid-canvas-wrap">
          <svg id="scene-svg" class="grid-svg" viewBox="0 0 1000 700" aria-label="Lưới ô vuông tam giác">
            <rect x="0" y="0" width="1000" height="700" rx="16" fill="#ffffff" />
            ${gridLines}
            ${extensionSvg}
            <polygon points="${polyPts}" fill="rgba(56, 189, 248, 0.14)" stroke="#0284c7" stroke-width="3.5" stroke-linejoin="round" />
            <line x1="${b1.x}" y1="${b1.y}" x2="${b2.x}" y2="${b2.y}" stroke="#ea580c" stroke-width="6.5" stroke-linecap="round" />
            ${extraLines}
            ${candidateNodes}
            ${vertexNodes}
          </svg>
        </div>
      `;
    }

    /**
     * Render các nút chọn vòng nhanh
     */
    function renderRoundPills() {
      const container = document.getElementById('round-pills');
      const rounds = [
        { r: 1, name: 'Vòng 1: Bắt đỉnh - Bắt đáy', color: 'sky' },
        { r: 2, name: 'Vòng 2: Vẽ đường cao', color: 'indigo' },
        { r: 3, name: 'Vòng 3: Giải cứu đường cao', color: 'emerald' }
      ];
      const currentLevel = LEVELS[state.currentIndex];

      container.innerHTML = rounds.map((item) => {
        const active = !state.finished && currentLevel && currentLevel.round === item.r;
        const firstIdx = LEVELS.findIndex((l) => l.round === item.r);
        return `
          <button type="button" data-jump-round="${firstIdx}"
            class="px-3 py-1 rounded-full text-xs font-bold border transition ${
              active
                ? 'bg-slate-900 text-white border-slate-900 shadow-xs'
                : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
            }">
            ${item.name}
          </button>
        `;
      }).join('');

      container.querySelectorAll('[data-jump-round]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-jump-round'));
          goToLevel(idx);
        });
      });
    }

    /**
     * Cập nhật điểm số & thanh tiến độ
     */
    function updateHeaderStats() {
      document.getElementById('score-display').textContent = state.score;
      const total = LEVELS.length;
      const currentNum = state.finished ? total : state.currentIndex + 1;
      document.getElementById('progress-text').textContent = `${currentNum} / ${total}`;
      const pct = state.finished ? 100 : Math.round(((state.currentIndex + 1) / total) * 100);
      document.getElementById('progress-bar').style.width = `${pct}%`;
      renderRoundPills();
    }

    /**
     * Điều hướng tới câu hỏi cụ thể
     */
    function goToLevel(index) {
      state.finished = false;
      state.currentIndex = Math.max(0, Math.min(LEVELS.length - 1, index));
      const lvl = LEVELS[state.currentIndex];
      const prevAns = state.answeredMap[lvl.id];

      state.selectedChoice = null;
      state.drawSelectedVertex = prevAns ? lvl.requiredFrom : null;
      state.drawSelectedFootId = prevAns
        ? (lvl.candidateFeet.find((f) => f.isCorrect)?.id || null)
        : null;
      state.selectedErrorId = null;
      state.showFixedLine = Boolean(prevAns);

      render();
    }

    /**
     * Render giao diện chính theo từng vòng hoặc màn tổng kết
     */
    function render() {
      updateHeaderStats();
      const container = document.getElementById('game-container');
      container.classList.remove('pop-in');
      void container.offsetWidth;
      container.classList.add('pop-in');

      if (state.finished) {
        renderSummary(container);
        return;
      }

      const level = LEVELS[state.currentIndex];
      const geom = getLevelGeometry(level);
      const baseText = `${geom.base[0]}${geom.base[1]}`;
      const ansRecord = state.answeredMap[level.id];

      let interactionHtml = '';

      if (level.round === 1) {
        interactionHtml = `
          <div class="space-y-4">
            <div class="bg-sky-50 border border-sky-200 rounded-2xl p-3.5 sm:p-4">
              <div class="text-xs font-bold uppercase tracking-wider text-sky-700 mb-1">Đáy đã chọn: <span class="text-orange-600 text-sm">${baseText}</span></div>
              <p class="text-sm sm:text-base font-bold text-slate-900">${level.prompt}</p>
            </div>

            <div class="grid grid-cols-3 gap-2.5 sm:gap-3">
              ${level.choices.map((ch) => {
                let btnStyle = 'bg-white hover:bg-sky-50 border-slate-200 text-slate-900';
                if (ansRecord) {
                  if (ch === level.correctVertex) {
                    btnStyle = 'bg-emerald-100 border-emerald-500 text-emerald-950 ring-2 ring-emerald-400';
                  } else if (state.selectedChoice === ch && ch !== level.correctVertex) {
                    btnStyle = 'bg-rose-100 border-rose-500 text-rose-950';
                  }
                }
                return `
                  <button type="button" data-choice="${ch}"
                    class="py-3.5 sm:py-4 rounded-2xl border-2 font-extrabold text-xl sm:text-2xl shadow-xs active:scale-95 transition ${btnStyle}">
                    Đỉnh ${ch}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else if (level.round === 2) {
        interactionHtml = `
          <div class="space-y-4">
            <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-3.5 sm:p-4">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-700">
                  Đáy màu cam: <span class="text-orange-600">${baseText}</span>
                </span>
                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-white text-indigo-800 border border-indigo-200">
                  Bước 1: Đỉnh ${state.drawSelectedVertex || '?'} • Bước 2: Điểm ${state.drawSelectedFootId ? level.candidateFeet.find(f => f.id === state.drawSelectedFootId)?.label.split(' ')[0] : '?'}
                </span>
              </div>
              <p class="text-sm sm:text-base font-bold text-slate-900">${level.prompt}</p>
            </div>

            <!-- Nút chọn nhanh trên điện thoại/máy tính -->
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 sm:p-3.5 space-y-3">
              <div>
                <div class="text-xs font-bold text-slate-700 mb-2">1. Chọn đỉnh đối diện (hoặc chạm trực tiếp trên lưới):</div>
                <div class="flex flex-wrap gap-2">
                  ${geom.order.map((vKey) => {
                    const active = state.drawSelectedVertex === vKey;
                    return `
                      <button type="button" data-pick-vertex="${vKey}"
                        class="px-4 py-2 rounded-xl border font-bold text-sm transition active:scale-95 ${
                          active
                            ? 'bg-indigo-600 text-white border-indigo-600 shadow-xs'
                            : 'bg-white text-slate-800 border-slate-300 hover:bg-indigo-50'
                        }">
                        Đỉnh ${vKey}
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              <div>
                <div class="text-xs font-bold text-slate-700 mb-2">2. Chọn điểm hạ vuông góc (hoặc chạm vòng tròn trên lưới):</div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  ${level.candidateFeet.map((f) => {
                    const active = state.drawSelectedFootId === f.id;
                    return `
                      <button type="button" data-pick-foot="${f.id}"
                        class="px-3 py-2.5 rounded-xl border text-left text-xs sm:text-sm font-semibold transition active:scale-95 ${
                          active
                            ? 'bg-sky-600 text-white border-sky-600 shadow-xs'
                            : 'bg-white text-slate-800 border-slate-300 hover:bg-sky-50'
                        }">
                        ${f.label}
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              <button id="btn-check-draw" type="button"
                class="flex-1 sm:flex-initial px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold text-sm shadow-sm transition">
                Kiểm tra đường cao
              </button>
              <button id="btn-reset-draw" type="button"
                class="px-4 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-bold text-sm transition">
                Vẽ lại
              </button>
            </div>
          </div>
        `;
      } else if (level.round === 3) {
        interactionHtml = `
          <div class="space-y-4">
            <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3.5 sm:p-4">
              <div class="text-xs font-bold uppercase tracking-wider text-emerald-800 mb-1">
                Đáy đã cho: <span class="text-orange-600">${baseText}</span>
              </div>
              <p class="text-sm sm:text-base font-bold text-slate-900">${level.prompt}</p>
            </div>

            <div class="space-y-2">
              ${level.errorOptions.map((opt) => {
                let cls = 'bg-white hover:bg-emerald-50 border-slate-200 text-slate-900';
                if (ansRecord) {
                  if (opt.id === level.correctErrorId) {
                    cls = 'bg-emerald-100 border-emerald-500 text-emerald-950 ring-2 ring-emerald-400';
                  } else if (state.selectedErrorId === opt.id) {
                    cls = 'bg-rose-100 border-rose-500 text-rose-950';
                  }
                }
                return `
                  <button type="button" data-error-id="${opt.id}"
                    class="w-full text-left px-4 py-3.5 rounded-2xl border-2 font-bold text-xs sm:text-sm transition active:scale-[0.99] ${cls}">
                    ${opt.label}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      const feedbackHtml = ansRecord ? `
        <div class="mt-4 rounded-2xl p-4 border ${
          ansRecord.correct
            ? 'bg-emerald-50 border-emerald-300 text-emerald-950'
            : 'bg-amber-50 border-amber-300 text-amber-950'
        }">
          <div class="flex items-start justify-between gap-3">
            <div>
              <div class="font-extrabold text-sm sm:text-base">
                ${ansRecord.correct ? 'Chính xác! +10 điểm' : 'Chưa đúng hẳn — cùng xem giải thích nhé'}
              </div>
              <p class="text-xs sm:text-sm mt-1 leading-relaxed">${level.explanation}</p>
            </div>
          </div>
          <div class="mt-3 flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-black/5">
            <button id="btn-retry-level" type="button"
              class="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-50 border border-slate-300 text-slate-800 font-bold text-xs sm:text-sm transition">
              Thử lại màn này
            </button>
            <button id="btn-next-level" type="button"
              class="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 active:scale-95 text-white font-bold text-xs sm:text-sm shadow-xs transition">
              ${state.currentIndex < LEVELS.length - 1 ? 'Câu tiếp theo →' : 'Xem tổng kết →'}
            </button>
          </div>
        </div>
      ` : '';

      container.innerHTML = `
        <section class="bg-white rounded-3xl shadow-sm border border-slate-200/90 p-4 sm:p-6">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-extrabold border ${level.badgeClass}">
              ${level.roundTitle}
            </span>
            <button id="btn-toggle-hint" type="button"
              class="text-xs font-bold text-sky-700 hover:text-sky-900 bg-sky-50 hover:bg-sky-100 px-3 py-1.5 rounded-full transition">
              Gợi ý
            </button>
          </div>

          <div id="hint-box" class="hidden mb-4 bg-sky-50/80 border border-sky-200 rounded-2xl p-3 text-xs sm:text-sm text-sky-950 font-medium">
            ${level.hint}
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            <div class="lg:col-span-7">
              ${renderGridSvg(level, {
                interactiveVertices: level.round === 2 && !ansRecord,
                interactiveFeet: level.round === 2 && !ansRecord
              })}
              <div class="mt-2.5 flex flex-wrap items-center gap-4 text-[11px] sm:text-xs text-slate-500 font-medium">
                <span class="inline-flex items-center gap-1.5">
                  <span class="w-3.5 h-1.5 rounded-full bg-orange-600 inline-block"></span>
                  Cạnh đáy đã cho
                </span>
                <span class="inline-flex items-center gap-1.5">
                  <span class="w-3.5 h-0.5 border-t-2 border-dashed border-teal-600 inline-block"></span>
                  Phần kéo dài đáy (nếu có)
                </span>
              </div>
            </div>

            <div class="lg:col-span-5">
              ${interactionHtml}
              ${feedbackHtml}
            </div>
          </div>
        </section>
      `;

      bindLevelEvents(level);
    }

    /**
     * Gắn sự kiện tương tác cho từng vòng chơi
     */
    function bindLevelEvents(level) {
      const hintBtn = document.getElementById('btn-toggle-hint');
      const hintBox = document.getElementById('hint-box');
      if (hintBtn && hintBox) {
        hintBtn.addEventListener('click', () => {
          hintBox.classList.toggle('hidden');
        });
      }

      const retryBtn = document.getElementById('btn-retry-level');
      if (retryBtn) {
        retryBtn.addEventListener('click', () => {
          if (state.answeredMap[level.id]?.correct) {
            state.score = Math.max(0, state.score - state.answeredMap[level.id].pointsEarned);
          }
          delete state.answeredMap[level.id];
          goToLevel(state.currentIndex);
        });
      }

      const nextBtn = document.getElementById('btn-next-level');
      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
          if (state.currentIndex < LEVELS.length - 1) {
            goToLevel(state.currentIndex + 1);
          } else {
            state.finished = true;
            render();
          }
        });
      }

      // Vòng 1: Chọn đỉnh đối diện
      if (level.round === 1) {
        document.querySelectorAll('[data-choice]').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (state.answeredMap[level.id]) return;
            const chosen = btn.getAttribute('data-choice');
            state.selectedChoice = chosen;
            const isCorrect = chosen === level.correctVertex;
            const pts = isCorrect ? 10 : 0;
            state.answeredMap[level.id] = { correct: isCorrect, pointsEarned: pts };
            state.score += pts;
            showToast(
              isCorrect ? 'Chính xác! Đã tìm đúng đỉnh đối diện.' : `Đỉnh đối diện đúng là ${level.correctVertex}.`,
              isCorrect ? 'success' : 'error'
            );
            render();
          });
        });
      }

      // Vòng 2: Chọn đỉnh và điểm chân đường cao (cả nút bấm lẫn chạm trên SVG)
      if (level.round === 2) {
        const selectVertex = (vKey) => {
          if (state.answeredMap[level.id]) return;
          state.drawSelectedVertex = vKey;
          render();
        };

        const selectFoot = (fId) => {
          if (state.answeredMap[level.id]) return;
          state.drawSelectedFootId = fId;
          render();
        };

        document.querySelectorAll('[data-pick-vertex]').forEach((btn) => {
          btn.addEventListener('click', () => selectVertex(btn.getAttribute('data-pick-vertex')));
        });

        document.querySelectorAll('[data-pick-foot]').forEach((btn) => {
          btn.addEventListener('click', () => selectFoot(btn.getAttribute('data-pick-foot')));
        });

        document.querySelectorAll('#scene-svg [data-vertex]').forEach((el) => {
          el.addEventListener('click', () => selectVertex(el.getAttribute('data-vertex')));
        });

        document.querySelectorAll('#scene-svg [data-foot-id]').forEach((el) => {
          el.addEventListener('click', () => selectFoot(el.getAttribute('data-foot-id')));
        });

        const resetDrawBtn = document.getElementById('btn-reset-draw');
        if (resetDrawBtn) {
          resetDrawBtn.addEventListener('click', () => {
            if (state.answeredMap[level.id]) return;
            state.drawSelectedVertex = null;
            state.drawSelectedFootId = null;
            render();
          });
        }

        const checkDrawBtn = document.getElementById('btn-check-draw');
        if (checkDrawBtn) {
          checkDrawBtn.addEventListener('click', () => {
            if (state.answeredMap[level.id]) return;
            if (!state.drawSelectedVertex || !state.drawSelectedFootId) {
              showToast('Hãy chọn đủ cả ĐỈNH đối diện và ĐIỂM chân đường cao trước nhé!', 'info');
              return;
            }
            const chosenFoot = level.candidateFeet.find((f) => f.id === state.drawSelectedFootId);
            const isCorrect = state.drawSelectedVertex === level.requiredFrom && Boolean(chosenFoot?.isCorrect);
            const pts = isCorrect ? 10 : 0;
            state.answeredMap[level.id] = { correct: isCorrect, pointsEarned: pts };
            state.score += pts;
            showToast(
              isCorrect ? 'Tuyệt vời! Đường cao đã vuông góc chuẩn xác.' : 'Đường vẽ chưa đúng đỉnh hoặc chưa vuông góc.',
              isCorrect ? 'success' : 'error'
            );
            render();
          });
        }
      }

      // Vòng 3: Chỉ ra lỗi sai của đường cao bị lạc
      if (level.round === 3) {
        document.querySelectorAll('[data-error-id]').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (state.answeredMap[level.id]) return;
            const errId = btn.getAttribute('data-error-id');
            state.selectedErrorId = errId;
            state.showFixedLine = true;
            const isCorrect = errId === level.correctErrorId;
            const pts = isCorrect ? 10 : 0;
            state.answeredMap[level.id] = { correct: isCorrect, pointsEarned: pts };
            state.score += pts;
            showToast(
              isCorrect ? 'Đã giải cứu thành công đường cao!' : 'Đã hiển thị đường cao chuẩn để bạn đối chiếu.',
              isCorrect ? 'success' : 'error'
            );
            render();
          });
        });
      }
    }

    /**
     * Render màn hình tổng kết sau khi hoàn thành tất cả câu hỏi
     */
    function renderSummary(container) {
      const maxScore = LEVELS.length * 10;
      const correctCount = Object.values(state.answeredMap).filter((v) => v.correct).length;
      const ratio = state.score / maxScore;

      let rankTitle = 'Nhà Khám Phá Hình Học';
      let rankMsg = 'Bạn đã hoàn thành đầy đủ các thử thách trên lưới ô vuông. Hãy ôn thêm phần góc tù ở đáy để thêm vững vàng nhé!';
      if (ratio >= 0.85) {
        rankTitle = 'Kỹ Sư Đường Cao Xuất Sắc';
        rankMsg = 'Bạn xác định đỉnh đối diện và vẽ đường cao vuông góc rất chắc chắn, kể cả khi đáy có góc tù!';
      } else if (ratio >= 0.55) {
        rankTitle = 'Kiến Trúc Sư Triển Vọng';
        rankMsg = 'Nền tảng của bạn khá tốt! Hãy chú ý kiểm tra góc vuông 90° và phần kéo dài của đáy.';
      }

      container.innerHTML = `
        <section class="bg-white rounded-3xl shadow-sm border border-slate-200/90 p-6 sm:p-8 text-center max-w-2xl mx-auto">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white text-2xl font-extrabold shadow-md mb-4">
            ★
          </div>
          <div class="text-xs font-extrabold uppercase tracking-wider text-emerald-700 mb-1">Hoàn thành hành trình</div>
          <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">${rankTitle}</h2>
          <p class="text-sm text-slate-600 mt-2 max-w-lg mx-auto">${rankMsg}</p>

          <div class="grid grid-cols-2 gap-3 sm:gap-4 my-6">
            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4">
              <div class="text-xs font-bold uppercase text-amber-700">Tổng điểm</div>
              <div class="text-2xl sm:text-3xl font-extrabold text-amber-900 mt-1">${state.score} / ${maxScore}</div>
            </div>
            <div class="bg-sky-50 border border-sky-200 rounded-2xl p-4">
              <div class="text-xs font-bold uppercase text-sky-700">Câu trả lời đúng</div>
              <div class="text-2xl sm:text-3xl font-extrabold text-sky-900 mt-1">${correctCount} / ${LEVELS.length}</div>
            </div>
          </div>

          <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-xs sm:text-sm font-bold text-emerald-950 mb-6">
            Chốt kiến thức: "Đường cao được kẻ qua đỉnh đối diện và vuông góc với đáy đã cho."
          </div>

          <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <button id="btn-play-again-summary" type="button"
              class="w-full sm:w-auto px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold text-sm shadow-sm transition">
              Chơi lại từ đầu
            </button>
            <button id="btn-review-first" type="button"
              class="w-full sm:w-auto px-5 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-800 font-bold text-sm transition">
              Xem lại từ câu 1
            </button>
          </div>
        </section>
      `;

      document.getElementById('btn-play-again-summary').addEventListener('click', resetAllGame);
      document.getElementById('btn-review-first').addEventListener('click', () => goToLevel(0));
    }

    /**
     * Đặt lại toàn bộ trạng thái trò chơi
     */
    function resetAllGame() {
      state.currentIndex = 0;
      state.score = 0;
      state.answeredMap = {};
      state.selectedChoice = null;
      state.drawSelectedVertex = null;
      state.drawSelectedFootId = null;
      state.selectedErrorId = null;
      state.showFixedLine = false;
      state.finished = false;
      showToast('Đã đặt lại trò chơi từ đầu.', 'info');
      render();
    }

    // Khởi tạo ứng dụng
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btn-restart-all').addEventListener('click', resetAllGame);
      render();
    });
  </script>
</body>
</html>
